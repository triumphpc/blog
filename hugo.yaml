baseURL: "https://triumphpc.github.io/"
defaultContentLanguage: en
pagination:
  pagerSize: 5

enableRobotsTXT: true
buildDrafts: false
buildFuture: true
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

languages:
  en:
    languageName: "English"
    weight: 1
    title: "Sebastian PE — Go, AI & Engineering"
    params:
      description: "Technical blog about Go, LLM, AI Agents and software engineering"
      homeInfoParams:
        Title: "Hi there 👋"
        Content: Welcome to my blog about Go, LLM, AI Agents and engineering.
    menu:
      main:
        - identifier: posts
          name: Posts
          url: /posts/
          weight: 5
        - identifier: tags
          name: Tags
          url: /tags/
          weight: 10
        - identifier: archives
          name: Archive
          url: /archives/
          weight: 15
        - identifier: about
          name: About
          url: /pages/about/
          weight: 20
        - identifier: projects
          name: Projects
          url: /pages/projects/
          weight: 25
  ru:
    languageName: "Русский"
    weight: 2
    title: "Sebastian PE — Go, AI и инженерия"
    params:
      description: "Технический блог о Go, LLM, AI-агентах и инженерии"
      homeInfoParams:
        Title: "Привет 👋"
        Content: Блог о Go, LLM, AI-агентах и инженерии.
    menu:
      main:
        - identifier: posts
          name: Посты
          url: /posts/
          weight: 5
        - identifier: tags
          name: Теги
          url: /tags/
          weight: 10
        - identifier: archives
          name: Архив
          url: /archives/
          weight: 15
        - identifier: about
          name: Обо мне
          url: /pages/about/
          weight: 20
        - identifier: projects
          name: Проекты
          url: /pages/projects/
          weight: 25

params:
  mainSections:
    - posts
  env: production
  keywords: [Blog, Go, LLM, AI, Agents, Engineering]
  author: Sebastian PE
  images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "January 2, 2006"
  defaultTheme: dark
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    favicon: "/favicon.ico"
    disableHLJS: true

  label:
    text: "Sebastian PE"
    icon: /apple-touch-icon.png
    iconHeight: 35

  socialIcons:
    - name: github
      url: "https://github.com/triumphpc"

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  editPost:
    URL: "https://github.com/triumphpc/blog/content"
    Text: "Suggest Changes"
    appendFilePath: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

outputs:
  home:
    - HTML
    - RSS
    - JSON

pygmentsUseClasses: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: dracula

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod
