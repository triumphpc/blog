baseURL: "https://svrulin.github.io/"
title: "svrulin — Go, AI & Engineering"
paginate: 5

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "svrulin — Go, AI & Engineering"
  description: "Technical blog about Go, LLM, AI Agents and software engineering"
  keywords: [Blog, Go, LLM, AI, Agents, Engineering]
  author: Sergey Vrulin
  images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "January 2, 2006"
  defaultTheme: dark
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    favicon: "/favicon.ico"
    disableHLJS: true

  label:
    text: "svrulin"
    icon: /apple-touch-icon.png
    iconHeight: 35

  homeInfoParams:
    Title: "Hi there \U0001F44B"
    Content: Welcome to my blog about Go, LLM, AI Agents and engineering.

  socialIcons:
    - name: github
      url: "https://github.com/svrulin"

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  editPost:
    URL: "https://github.com/svrulin/blog/content"
    Text: "Suggest Changes"
    appendFilePath: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

outputs:
  home:
    - HTML
    - RSS
    - JSON

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 5
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 10
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 15
    - identifier: about
      name: About
      url: /pages/about/
      weight: 20
    - identifier: projects
      name: Projects
      url: /pages/projects/
      weight: 25

pygmentsUseClasses: true

markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: dracula

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod
